name: Backend Compile

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend_compile.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend_compile.yml'

permissions:
  contents: read

jobs:
  construir:
    name: Build y pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verificar backend
        run: |
          if [ ! -f backend/pom.xml ]; then
            echo "::notice::No hay carpeta backend/ en este repo; workflow omitido."
            exit 0
          fi

      - name: Java 21
        if: hashFiles('backend/pom.xml') != ''
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build y pruebas
        if: hashFiles('backend/pom.xml') != ''
        working-directory: backend
        run: ./mvnw --batch-mode --no-transfer-progress package -DskipTests
