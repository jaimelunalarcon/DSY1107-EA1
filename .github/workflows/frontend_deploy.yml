name: Frontend Deploy

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'scripts/**'
      - '.github/workflows/frontend_deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUTA_BUILD: frontend/dist

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Generar config.ts
        env:
          REGION: ${{ vars.AWS_REGION }}
          USER_POOL_ID: ${{ vars.COGNITO_USER_POOL_ID }}
          COGNITO_DOMAIN: ${{ vars.COGNITO_DOMAIN }}
          CLIENT_ID: ${{ vars.COGNITO_CLIENT_ID }}
          API_URL: ${{ vars.API_URL }}
        run: scripts/config-frontend.sh

      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Credenciales de AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Publicar en Amplify
        env:
          APP_ID: ${{ vars.AMPLIFY_APP_ID }}
          RAMA: ${{ vars.AMPLIFY_BRANCH }}
          DESTINO: ${{ vars.REDIRECT_URI }}
        run: |
          RAMA="${RAMA:-main}"
          [ -n "$APP_ID" ] || { echo "::error::Falta AMPLIFY_APP_ID. Ejecuta ./sincronizar-github.sh"; exit 1; }
          scripts/publicar-amplify.sh "$APP_ID" "$RAMA" "$RUTA_BUILD"
          echo "### Front publicado en ${DESTINO%/}" >> "$GITHUB_STEP_SUMMARY"
