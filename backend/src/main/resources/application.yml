# =============================================================================
# DSY1107 - EA1 - Backend de solicitudes de presupuesto.
#
# En ECS las variables SPRING_DATASOURCE_* y BACKEND_CORS_ORIGENES_* las
# inyecta la task (terraform/ecs.tf).
# =============================================================================

spring:
  application:
    name: ae1-backend

  # Si SPRING_DATASOURCE_URL no viene, H2 en memoria (pruebas / local sin RDS).
  # En ECS Terraform inyecta el JDBC de PostgreSQL.
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:dsy1107;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}

  jpa:
    hibernate:
      # validate: el esquema lo manda Flyway; Hibernate solo comprueba.
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

  # Cluster local de docker/rabbitmq (3 nodos). En ECS se pisa con RABBITMQ_*.
  rabbitmq:
    addresses: ${RABBITMQ_ADDRESSES:localhost:5672,localhost:5673,localhost:5674}
    address-shuffle-mode: random
    username: ${RABBITMQ_USER:admin}
    password: ${RABBITMQ_PASSWORD:admin123}
    connection-timeout: 3s
    publisher-confirm-type: correlated
    publisher-returns: true

# Topologia de mensajeria (EP2). Debe coincidir con notificaciones-ms.
mensajeria:
  habilitada: ${MENSAJERIA_HABILITADA:true}
  exchange: presupuestos.exchange
  routing-keys:
    solicitud-creada: solicitud.creada
    solicitud-decidida: solicitud.decidida

server:
  port: 8080
  error:
    include-message: always
    include-stacktrace: never

backend:
  cors:
    # Local. En ECS se pisan con BACKEND_CORS_ORIGENES_* (incluye Amplify).
    origenes:
      - http://localhost:4200
      - http://localhost:5173

# /actuator/health es el health check de la task ECS. RabbitMQ no entra en el
# health: si el broker cae, el API de presupuestos debe seguir sano.
management:
  health:
    rabbit:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: false

logging:
  level:
    cl.duoc.dsy1107.ae1: DEBUG
